name: build-patched-frida

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "Frida version/tag to build (must match your host frida)"
        required: true
        default: "16.2.2"

jobs:
  build-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (workflow + patch.sh)
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK r25b
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential tree ninja-build gcc-multilib g++-multilib \
            lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests \
            python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386
          sudo gem install fpm -v 1.11.0 --no-document
          python3 -m pip install lief

      - name: Clone frida ${{ github.event.inputs.frida_version }} with submodules
        run: |
          git clone --recurse-submodules --branch "${{ github.event.inputs.frida_version }}" \
            https://github.com/frida/frida

      - name: Apply anti-detection patches
        run: bash patch.sh

      - name: Build frida-server for android-arm64
        run: |
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd frida
          ./configure --host=android-arm64
          make

      - name: Collect frida-server
        run: |
          mkdir -p out
          # in-tree build output location (frida 16.x)
          f=$(find frida -type f -name frida-server -path '*server*' | head -1)
          echo "found: $f"
          cp "$f" out/frida-server-patched-16-android-arm64
          # also grab frida-gadget if present (optional)
          g=$(find frida -type f -name 'frida-gadget*.so' | head -1 || true)
          [ -n "$g" ] && cp "$g" out/ || true
          ls -la out
          file out/* || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-patched-android-arm64
          path: out/*
          if-no-files-found: error
          retention-days: 7
